name: Deploy to GitHub Pages

# The repository is private, but a GitHub Pages site is PUBLIC regardless.
#
# This deploys the `public` profile: BSB section headings, which were dedicated
# to the public domain on 2023-04-30, plus introductions and topics written for
# this project. All of it is ours to publish outright.
#
# The purchased [licensed content removed] are NOT in this build and must never be. In a
# compilation the protected element is the selection and arrangement, not the
# labels, so rewording would not have cleared it — hence a scheme we own.
# See DATA-LICENSE.md and src/data/sections/SOURCE.md.
#
# Changing this to `full` would publish purchased material to the open web.
# Do not do it without resolving the rights question first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tested under the profile this workflow deploys, not the default.
      # `npm test` with DATA_PROFILE unset runs `full`, which is the one
      # profile that must never be published — so the deploy was gated on a
      # suite that had never exercised the build it was about to upload.
      # CI runs all three profiles; this job runs the one it is deploying.
      - name: Typecheck, lint, test (public)
        env:
          DATA_PROFILE: public
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build (public)
        env:
          DATA_PROFILE: public
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # The gate. This greps the actual built files for the purchased titles and
      # intro prose. If any survived, the deploy stops here.
      - name: Verify no purchased content in the artefact
        run: npm run verify:bundle -- --profile public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
