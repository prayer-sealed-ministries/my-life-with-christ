name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repository is private and the outline data is purchased third-party
# material (see DATA-LICENSE.md). Nothing here publishes a build anywhere.
permissions:
  contents: read

jobs:
  # The data gate stands alone, and deliberately depends on no other job.
  #
  # It is the check branch protection requires by name, so it must be able to
  # fail on its own terms. If it were chained behind lint or tests, an unrelated
  # failure upstream would leave the required check *pending* rather than
  # failing — and a gate that can sit pending is not a gate.
  data-gate:
    name: data-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The probe set must be as large as the frozen baseline, whichever build
      # we are checking. A shrunken probe set means a weakened gate.
      - name: Workflow policy and probe-set integrity
        run: npx vitest run scripts/__tests__/

      - name: Build (refs-only)
        env:
          DATA_PROFILE: refs-only
        run: npm run build

      - name: Gate — no purchased compilation in a publishable build
        run: npm run verify:bundle -- --profile refs-only

      # The other direction: a silently empty dataset would pass the refs-only
      # check trivially. Assert the full build really does carry the data.
      - name: Build (full)
        run: npm run build

      - name: Gate — full build still carries the compilation
        run: npm run verify:bundle -- --profile full

  check:
    name: typecheck, lint, test (all profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # `npm test` alone only ever tested `full`, because that is the default
      # when DATA_PROFILE is unset — and `public` is the profile that is
      # actually deployed. This runs the suite under all three and additionally
      # asserts that no test is skipped under every one of them, which is the
      # way a shape-gated test can quietly stop measuring anything.
      - name: Test (full, public, refs-only)
        run: npm run test:profiles

  # Accessibility is a stated non-negotiable, so it is enforced rather than
  # reviewed. axe-core at WCAG 2.1 AA over every view in both themes at both
  # widths, plus the checks axe cannot make: heading order, computed contrast,
  # real labels, and a keyboard-only walkthrough from load to saving an entry.
  accessibility:
    # Run against both profiles that a person actually uses. `full` is what the
    # owner runs locally; `public` is what is deployed to Pages and is the only
    # one anyone else will ever see. They render different segment lists, so a
    # pass on one is not a pass on the other — and until now only `full` was
    # ever checked, because DATA_PROFILE was unset and `full` is the default.
    name: accessibility (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [full, public]
    runs-on: ubuntu-latest
    env:
      DATA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # axe covers roughly a third of WCAG. The reflow suite covers three AA
      # criteria it cannot check at all: 1.4.10 (320px reflow), 1.4.4 (200%
      # text) and 1.4.12 (reader-imposed text spacing).
      - name: axe, keyboard, contrast, reflow
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-failure-traces-${{ matrix.profile }}
          path: test-results/
          retention-days: 7

  # The end-to-end suite, on the two profiles a person actually uses.
  #
  # It had only ever run on a developer's machine, which meant the one suite
  # that drives the real browser against the real bundle was invisible to
  # everyone else and unrecorded — a green report nobody but its author could
  # check. `test:a11y` above is a subset of this and runs on every pull
  # request; the whole suite takes ~6 minutes per profile, so it runs on
  # pushes to main rather than on every commit.
  e2e:
    name: e2e (${{ matrix.profile }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        profile: [full, public]
    runs-on: ubuntu-latest
    env:
      DATA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # The suite reports which profile the served bundle carries, read from
      # the build rather than from DATA_PROFILE above. If those two ever
      # disagree, the log says so.
      - name: Playwright — all specs
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-traces-${{ matrix.profile }}
          path: test-results/
          retention-days: 7

  # Re-running the ingest must reproduce exactly what is committed. If a parser
  # change silently alters the data, this fails rather than drifting unnoticed.
  ingest-is-reproducible:
    name: ingest is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Ingest output matches what is committed
        run: |
          if ! git diff --exit-code --stat -- src/data/outlines.json data/; then
            echo "::error::Re-running the ingest changed committed data. Commit the regenerated files, or fix the parser."
            exit 1
          fi
