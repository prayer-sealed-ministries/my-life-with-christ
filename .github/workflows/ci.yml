name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes a build anywhere. See DATA-LICENSE.md for what this
# repository may and may not contain.
permissions:
  contents: read

jobs:
  # The data gate stands alone, and deliberately depends on no other job.
  #
  # It is the check branch protection requires by name, so it must be able to
  # fail on its own terms. If it were chained behind lint or tests, an unrelated
  # failure upstream would leave the required check *pending* rather than
  # failing — and a gate that can sit pending is not a gate.
  data-gate:
    name: data-gate
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow checkout. The licensed-data guard
      # reads commit messages as well as files, and with one commit to look at
      # it reports NULL MEASUREMENT and exits — correctly, since a scan of one
      # message proves nothing about a branch. Depth is what makes the check
      # real here rather than what makes it pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Before anything is built: no licensed or private source data may be
      # tracked at all. This runs first on purpose — it is cheap, it fails
      # closed, and everything after it produces artefacts.
      - name: Gate — no licensed or private data is tracked
        # Pull-request checkouts are detached merge commits. Even with the full
        # history fetched, `git log --branches --tags` has no local branch to
        # walk in that checkout. Give the guard the checked-out history
        # explicitly so its non-empty measurement floor remains meaningful.
        run: npm run verify:no-private-data -- HEAD

      # The native-policy tests assert against the assets actually copied into
      # the iOS and Android projects, and those are generated, not committed.
      # Without this step they have nothing to look at and say so by failing —
      # which is the right behaviour for a check about shipped bytes, and the
      # reason the build has to come first rather than the check being relaxed.
      - name: Build and sync native assets
        run: npm run native:assets && npm run native:sync

      - name: Workflow policy and native packaging
        run: npx vitest run scripts/__tests__/

      - name: Build (refs-only)
        env:
          DATA_PROFILE: refs-only
        run: npm run build

      - name: Gate — the refs-only build is clean
        run: npm run verify:bundle -- --profile refs-only

      # A different question about the same bytes: is the Scripture payload
      # still off the path between launching the app and writing a sentence?
      # Runs here rather than in its own job so it reads the artefact that was
      # just gated, and so a startup regression blocks the same merge.
      - name: Gate — Fast Capture does not wait for Scripture data (refs-only)
        run: npm run verify:startup -- --profile refs-only

      - name: Build (public)
        env:
          DATA_PROFILE: public
        run: npm run build

      - name: Gate — the deployed profile is clean
        run: npm run verify:bundle -- --profile public

      - name: Gate — Fast Capture does not wait for Scripture data (public)
        run: npm run verify:startup -- --profile public

  check:
    name: typecheck, lint, test (all profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and sync native assets
        run: npm run native:assets && npm run native:sync
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # `npm test` alone tests whichever profile is the default. This runs the
      # suite under both and additionally asserts that no test is skipped under
      # every one of them, which is the way a shape-gated test can quietly stop
      # measuring anything.
      - name: Test (public, refs-only)
        run: npm run test:profiles

  # Accessibility is a stated non-negotiable, so it is enforced rather than
  # reviewed. axe-core at WCAG 2.1 AA over every view in both themes at both
  # widths, plus the checks axe cannot make: heading order, computed contrast,
  # real labels, and a keyboard-only walkthrough from load to saving an entry.
  accessibility:
    # Both profiles this repository can build. `public` is deployed to Pages
    # and is the one anyone else will ever see; `refs-only` is the fallback.
    # They render different segment lists, so a pass on one is not a pass on
    # the other.
    name: accessibility (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [public, refs-only]
    runs-on: ubuntu-latest
    env:
      DATA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # axe covers roughly a third of WCAG. The reflow suite covers three AA
      # criteria it cannot check at all: 1.4.10 (320px reflow), 1.4.4 (200%
      # text) and 1.4.12 (reader-imposed text spacing).
      - name: axe, keyboard, contrast, reflow
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-failure-traces-${{ matrix.profile }}
          path: test-results/
          retention-days: 7

  # The end-to-end suite, on the two profiles a person actually uses.
  #
  # It had only ever run on a developer's machine, which meant the one suite
  # that drives the real browser against the real bundle was invisible to
  # everyone else and unrecorded — a green report nobody but its author could
  # check. `test:a11y` above is a subset of this and runs on every pull
  # request; the whole suite takes ~6 minutes per profile, so it runs on
  # pushes to main rather than on every commit.
  e2e:
    name: e2e (${{ matrix.profile }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        profile: [public, refs-only]
    runs-on: ubuntu-latest
    env:
      DATA_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # The suite reports which profile the served bundle carries, read from
      # the build rather than from DATA_PROFILE above. If those two ever
      # disagree, the log says so.
      - name: Playwright — all specs
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-traces-${{ matrix.profile }}
          path: test-results/
          retention-days: 7
