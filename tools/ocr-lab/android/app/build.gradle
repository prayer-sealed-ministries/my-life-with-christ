plugins { id 'com.android.application' }

android {
    namespace 'org.prayersealed.ocrlab'
    compileSdk 35

    defaultConfig {
        applicationId "org.prayersealed.ocrlab"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The BUNDLED Latin model: recognition works with no Play Services and no
    // network, which is what a local-first journal needs. The unbundled
    // variant is 78 KB but downloads its model on first use.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
